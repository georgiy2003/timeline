<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
</head>
<body>
  <main class="container">
    <h1 class="title">Timeline</h1>

    <section class="timeline">
      <div class="timeline__posts" id="posts">
        <!-- Здесь будут появляться записи -->
      </div>

        <form class="timeline__form" id="post-form">
        <input
            class="timeline__input"
            id="post-input"
            type="text"
            placeholder="Введите сообщение..."
            autocomplete="off"
        >

        <div class="media-controls">
        <button type="button" id="audio-record">
            Записать аудио
        </button>

        <button type="button" id="video-record">
            Записать видео
        </button>
        </div>
        </form>
    </section>
  </main>
</body>
</html>
