<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
</head>
<body>
  <main class="container">
    <h1 class="title">Timeline</h1>

    <section class="timeline">
      <div class="timeline__posts" id="posts"></div>

      <form class="timeline__form" id="post-form">
        <input
          class="timeline__input"
          id="post-input"
          type="text"
          placeholder="Введите сообщение..."
          autocomplete="off"
        >

        <div class="media-controls">
          <button
            class="media-button"
            type="button"
            id="audio-record"
            aria-label="Записать аудио"
            title="Записать аудио"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
              <path d="M12 19v3"></path>
              <path d="M8 22h8"></path>
            </svg>
            <span class="visually-hidden">Записать аудио</span>
          </button>

          <button
            class="media-button"
            type="button"
            id="video-record"
            aria-label="Записать видео"
            title="Записать видео"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="6" width="14" height="12" rx="2"></rect>
              <path d="m16 10 6-4v12l-6-4"></path>
            </svg>
            <span class="visually-hidden">Записать видео</span>
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
